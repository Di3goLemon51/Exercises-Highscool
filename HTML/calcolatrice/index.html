<!DOCTYPE html>
<html>
    <head>
        <title>Calcolatrice</title>

        <!-- Scripts -->
        <script src="script.js"></script>
    
        <!-- Styles -->
        <link rel="stylesheet" href="style.css">

        <!-- Bootstrap -->
        <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous"> -->
    </head>

    <!-- Possibile aggiunta onload="" in body -->
    <body onload="load()"> 
        <center>
            <h3>Calcolatrice</h3>

            <div class="dietro">
                <div class="spaziatore"></div>
                <table>
                    <tr>
                        <td colspan="3" rowspan="2"><textarea id="display" disabled></textarea></td>
                        <td><input class="bottoneS" type="button" value="C" onclick="cancel()"></td>
                    </tr>
                    <tr>
                        <td><input class="bottoneDel" type="button" value="Del" onclick="del()"></td>
                    </tr>
                    <tr>
                        <td><input type="button" value="7" onclick="n(this)"></td>
                        <td><input type="button" value="8" onclick="n(this)"></td>
                        <td><input type="button" value="9" onclick="n(this)"></td>
                        <td><input type="button" value="/" onclick="operazione(this)"></td>
                    </tr>
                    <tr>
                        <td><input type="button" value="4" onclick="n(this)"></td>
                        <td><input type="button" value="5" onclick="n(this)"></td>
                        <td><input type="button" value="6" onclick="n(this)"></td>
                        <td><input type="button" value="*" onclick="operazione(this)"></td>
                    </tr>
                    <tr>
                        <td><input type="button" value="1" onclick="n(this)"></td>
                        <td><input type="button" value="2" onclick="n(this)"></td>
                        <td><input type="button" value="3" onclick="n(this)"></td>
                        <td><input type="button" value="-" onclick="operazione(this)"></td>
                    </tr>
                    <tr>
                        <td><input type="button" value="." onclick="operazione(this)"></td>
                        <td><input type="button" value="0" onclick="n(this)"></td>
                        <td><input type="button" value="=" onclick="operazione(this)"></td>
                        <td><input type="button" value="+" onclick="operazione(this)"></td>
                    </tr>
                </table>
            </div>
        </center>
    </body>
</html>
